<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocal One</title>
<style>
@font-face{font-family:"Sora";src:url("font.ttf") format("truetype"),url("Sora.ttf") format("truetype");font-weight:100 800}
:root{--bg:#181818;--pn:#202020;--pn2:#262626;--tx:#ffffff;--dim:#969696;--ln:#303030;--a:#da291c;--m:#e8e8e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
[hidden]{display:none!important}
.v1{position:relative;display:flex;flex-direction:column;height:100%;color:var(--tx);font-family:Sora,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0;color:var(--tx)}
button:focus-visible,.kn:focus-visible{outline:2px solid var(--m);outline-offset:2px}
.hd{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--ln);height:56px;flex:none}
.studio{height:30px;mix-blend-mode:screen;opacity:.92;display:block}
.sepv{width:1px;height:28px;background:var(--ln)}
.logo{font-weight:700;font-size:16px;white-space:nowrap}.logo b{color:var(--a)}
.pre{flex:1;display:flex;align-items:center;gap:4px;background:var(--pn);border-radius:8px;padding:3px;box-shadow:inset 0 0 0 1px var(--ln);min-width:0}
select{background:transparent;color:var(--tx);border:0;font:600 12px Sora,"Segoe UI",sans-serif;padding:6px 4px;outline:none;min-width:0;cursor:pointer}
select option{background:#202020;color:#ffffff}
#gs{color:var(--a);max-width:140px}#ps{flex:1}
.ib{background:var(--pn2);font-size:11px;font-weight:600;padding:7px 10px;border-radius:6px;white-space:nowrap}
.ib:hover{background:#2e2e2e}
.ib.on{background:var(--a);color:#ffffff}
.gd{background:var(--pn2);font-size:11px;font-weight:700;padding:7px 11px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--m);color:var(--m);white-space:nowrap}
.gd.on{background:var(--m);color:#181818}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--ln);flex:none}
.tab{flex:1;background:transparent;font-size:11px;font-weight:600;padding:9px 2px 10px;border-radius:8px 8px 0 0;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{color:var(--tx)}
.tab.sel{background:var(--pn);color:var(--tx);box-shadow:inset 0 2px 0 var(--a)}
.tab.off{text-decoration:line-through;opacity:.55}
.pw{width:9px;height:9px;border-radius:50%;background:#444;flex:none}.pw.on{background:var(--a)}
.body{flex:1;min-height:0;background:var(--pn);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;align-items:center;gap:8px;flex:none}
.mh .nm{font-weight:700;font-size:14px;flex:1;min-width:0}
.mh .ds{display:none;font-weight:400;font-size:12px;color:var(--m);margin-top:2px}
.guide .mh .ds{display:block}
.sw{display:flex;align-items:center;gap:7px;background:var(--pn2);border-radius:999px;padding:4px 11px 4px 4px;font-size:11px;font-weight:700}
.sw i{width:32px;height:19px;border-radius:10px;background:#444;position:relative;display:block}
.sw i::after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#ffffff;transition:left .15s}
.sw.on i{background:var(--a)}.sw.on i::after{left:15px}
.content{flex:1;min-height:0}
.content.dis{opacity:.35;pointer-events:none}
.split{display:grid;grid-template-columns:350px 1fr;gap:16px;height:100%}
.viz{width:100%;height:100%;border-radius:10px;background:#141414;display:block}
.side{display:flex;flex-direction:column;gap:9px;min-width:0}
.sec{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.opts{display:flex;gap:5px;flex-wrap:wrap}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.kn{position:relative;text-align:center;cursor:ns-resize;touch-action:none;padding:3px 0;border-radius:8px}
.kn:hover{background:#ffffff08}
.kn .l{font-size:11px;color:var(--dim)}.kn .val{font-size:11px;font-weight:600}
.q{display:none;width:18px;height:18px;border-radius:50%;background:var(--m);color:#181818;font-size:11px;font-weight:700;line-height:18px;text-align:center;cursor:pointer;flex:none}
.guide .q{display:inline-block}
.kn .q{position:absolute;top:1px;left:calc(50% + 22px)}
.pop{position:absolute;z-index:9;width:300px;background:#222222;border-radius:12px;box-shadow:0 16px 40px #000c,inset 0 0 0 1px #303030;padding:14px 14px 12px;font-size:12px;line-height:1.5}
.pop h4{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--m)}
.pop .x{position:absolute;top:6px;right:8px;background:transparent;color:var(--dim);font-size:18px}
.pop .r{margin-top:6px}.pop .r b{color:var(--a)}
.pop .tip{margin-top:8px;padding:7px 9px;border-radius:8px;background:#ffffff10;color:#dddddd}
.bands{display:flex;gap:4px}
.bands button{flex:1;background:var(--pn2);font-size:11px;padding:7px 0;border-radius:6px;color:var(--dim)}
.bands button.sel{color:var(--tx);box-shadow:inset 0 0 0 1px var(--bc)}
.ft{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--ln);height:46px;flex:none}
.mt{flex:1;height:6px;border-radius:3px;background:#ffffff12;overflow:hidden}
.mt i{display:block;height:100%;width:0;background:#e8e8e8}
.outk{display:flex;align-items:center;gap:6px;color:var(--tx);font-weight:600;cursor:ns-resize;padding:4px 8px;border-radius:6px;background:var(--pn2);touch-action:none}
.mod{color:var(--a);font-weight:700}
.ask{flex:none;display:flex;flex-direction:column;gap:6px}
.ask form{display:flex;gap:6px;margin:0}
.ask input{flex:1;min-width:0;background:#141414;border:1px solid var(--ln);border-radius:8px;color:var(--tx);font:500 13px Sora,"Segoe UI",sans-serif;padding:9px 12px;outline:none}
.ask input:focus{border-color:var(--a)}
.ask input::placeholder{color:#6a6a6a}
.ask .ans{font-size:12px;line-height:1.5;color:#dddddd;background:#ffffff08;border-left:3px solid var(--a);border-radius:0 8px 8px 0;padding:7px 10px;display:flex;gap:10px;align-items:flex-start}
.ask .ans ul{margin:2px 0 0;padding-left:16px}
.ask .ans .grow{flex:1}
.save{position:absolute;z-index:9;top:58px;right:14px;width:290px;background:#222222;border-radius:12px;box-shadow:0 16px 40px #000c,inset 0 0 0 1px #303030;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.save input{background:#141414;border:1px solid var(--ln);border-radius:6px;color:var(--tx);font:600 12px Sora,"Segoe UI",sans-serif;padding:8px;outline:none}
.save input:focus{border-color:var(--a)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="v1 guide" id="root">
  <div class="hd">
    <img class="studio" src="la-pause.png" alt="La Pause">
    <span class="sepv"></span>
    <div class="logo">VOCAL<b>ONE</b></div>
    <div class="pre"><select id="gs" aria-label="Genre"></select><span style="color:#303030">|</span><select id="ps" aria-label="Preset"></select><button class="ib" id="prev" aria-label="Previous preset">‹</button><button class="ib" id="next" aria-label="Next preset">›</button></div>
    <button class="gd on" id="guide">? GUIDE</button><button class="ib" id="ab" title="Compare two settings">A</button><button class="ib" id="save">SAVE</button>

</div>
<script>
const $=i=>document.getElementById(i),TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const backend=window.__JUCE__&&window.__JUCE__.backend;
const BC=['#da291c','#da291c','#da291c','#da291c','#da291c'];
const MODS=[['GATE','gate','NOISE GATE'],['EQ','eq','EQUALIZER'],['DE-ESS','ds','DE-ESSER'],['COMP','comp','COMPRESSOR'],['SAT','sat','SATURATION'],['DOUBLE','dbl','DOUBLER'],['DELAY','dly','DELAY'],['REVERB','rev','REVERB']];
const CH={comp:['CLEAN','OPTO','FET','VARI-MU'],sat:['TAPE','TUBE','CONSOLE','FUZZ'],dsmode:['SPLIT','WIDE'],time:['1/16','1/8','1/8D','1/4','1/2'],rev:['ROOM','PLATE','HALL','CHAMBER','SPRING'],top:['hs','lp']};
const MDESC={gate:"Coupe le bruit de la pièce quand tu ne chantes pas.",eq:"Change la couleur de ta voix : plus grave, plus claire, moins nasale…",ds:"Calme les « sss » et les « ch » qui piquent les oreilles.",comp:"Égalise ta voix : les passages faibles remontent, les cris sont tenus.",sat:"Ajoute de la chaleur et du grain, comme du vieux matériel.",dbl:"Donne l'impression que tu as chanté plusieurs fois, en plus large.",dly:"Ajoute un écho qui répète ta voix en rythme.",rev:"Met ta voix dans une pièce : petite salle, grande église…"};
// For each setting: name, what it does, turning right, turning left, a tip for vocals.
const H={
 'gate.thr':['Seuil','À partir de quel volume le gate laisse passer le son.','Coupe plus : même des bruits assez forts disparaissent.','Coupe moins : seul le bruit très faible est enlevé.',"Monte jusqu'à ce que le souffle disparaisse, mais sans couper la fin des mots."],
 'gate.range':['Range','De combien le bruit est baissé quand le gate ferme.','Le bruit est complètement coupé.','Le bruit est juste un peu baissé, plus naturel.','Entre 15 et 30 dB, ça reste naturel.'],
 'gate.att':['Attack','La vitesse à laquelle le son revient quand tu recommences à chanter.','Le début des mots arrive plus doucement.','Le début des mots arrive tout de suite.','Laisse-le court, sinon tu perds le début des mots.'],
 'gate.rel':['Release','La vitesse à laquelle le gate se referme après la voix.','La fin des mots traîne plus longtemps.','Ça coupe vite après chaque mot.','Si la fin des mots est coupée, tourne à droite.'],
 'eq.f':['Fréquence','Quelle partie du son tu modifies, du plus grave au plus aigu.',"Tu vas vers les aigus (l'air, la brillance).",'Tu vas vers les graves (le corps, la boue).',"Vers 300 Hz : le côté « carton ». Vers 3 kHz : la présence. Au-dessus de 10 kHz : l'air."],
 'eq.g':['Gain','Combien tu montes ou baisses cette partie du son.','Plus fort : cette couleur ressort plus.','Moins fort : cette couleur est retirée.','Il vaut mieux baisser ce qui gêne que tout monter.'],
 'eq.q':['Largeur (Q)','Si tu touches une zone fine ou large autour de la fréquence.','Zone fine, précise, pour enlever un défaut.','Zone large, plus douce et musicale.','Pour enlever un bruit qui siffle : Q élevé. Pour colorer : Q bas.'],
 'ds.f':['Fréquence','Où se trouvent tes « sss ».','Vise des « sss » plus aigus.','Vise des « sss » plus graves, comme les « ch ».',"Active LISTEN et tourne jusqu'à n'entendre que les « sss »."],
 'ds.thr':['Seuil',"À partir de quand un « sss » est jugé trop fort.",'Agit seulement sur les « sss » très forts.','Agit sur plus de « sss », même les doux.',"Va vers la gauche jusqu'à ce que les « sss » piquent moins."],
 'ds.range':['Range','De combien les « sss » sont baissés au maximum.','Les « sss » sont très calmés.','Les « sss » sont à peine touchés.','Au-delà de 10 dB, la voix peut zozoter.'],
 'comp.thr':['Seuil','À partir de quel volume le compresseur agit.','Il agit moins souvent, seulement sur les cris.','Il agit plus souvent, sur toute la voix.','Règle pour voir 3 à 6 dB de réduction quand tu chantes.'],
 'comp.ratio':['Ratio','La force avec laquelle il écrase le son au-dessus du seuil.','Écrase plus : voix très stable, plus « radio ».','Plus doux et naturel.','2:1 à 4:1 pour du naturel, 6:1 et plus pour le rap énervé.'],
 'comp.knee':['Knee',"Si le compresseur s'enclenche d'un coup ou progressivement.","Il s'enclenche en douceur.","Il s'enclenche net, d'un coup.",'Un knee doux sonne plus naturel sur la voix.'],
 'comp.att':['Attack','La vitesse à laquelle le compresseur attrape ta voix.','Il attrape plus lentement : le début des mots claque plus.','Il attrape tout de suite : la voix est plus contrôlée et plus lisse.','5 à 15 ms garde le punch des consonnes.'],
 'comp.rel':['Release','La vitesse à laquelle il relâche ta voix après.','Il relâche lentement : plus doux, plus collé.','Il relâche vite : plus vivant, plus énergique.','Trop court, ça « pompe ». Trop long, ça étouffe.'],
 'comp.mk':['Makeup','Remonte le volume après la compression.','Plus fort.','Moins fort.',"Remonte jusqu'à ce que ON et OFF aient le même volume."],
 'sat.drive':['Drive','La quantité de grain ajoutée.','Plus de grain, plus sale, plus agressif.','Plus propre.','Un peu de drive aide la voix à passer sur les petites enceintes.'],
 'sat.tone':['Tone','Si le grain est plus sombre ou plus brillant.','Grain plus brillant.','Grain plus sombre et chaud.',''],
 'sat.mix':['Mix','Le mélange entre la voix propre et la voix saturée.','Plus de voix saturée.','Plus de voix propre.','Garde souvent la moitié de voix propre.'],
 'dbl.width':['Width','À quel point les doublures sont écartées à gauche et à droite.','Plus large, plus enveloppant.','Plus serré, plus au centre.','Sur la voix principale, reste modéré. Sur les chœurs, ouvre à fond.'],
 'dbl.det':['Detune','À quel point les doublures sont légèrement fausses.',"Plus d'effet chorale, plus épais.",'Plus propre et serré.','Trop de detune, et ça sonne faux.'],
 'dbl.dl':['Delay','Le petit retard des doublures.','Les doublures arrivent un peu après, plus naturel.','Elles arrivent pile en même temps.',''],
 'dbl.mix':['Mix','Le volume des doublures.',"Les doublures s'entendent plus.",'Plus discret.',''],
 'dly.fb':['Feedback',"Le nombre de fois que l'écho se répète.","L'écho se répète longtemps.",'Juste un ou deux échos.','Au-delà de 60 %, ça devient un effet spécial.'],
 'dly.mix':['Mix',"Le volume de l'écho.",'Écho plus fort.','Écho plus discret.',"Souvent mieux de l'entendre à peine."],
 'dly.lc':['Low cut',"Enlève les graves de l'écho.",'Écho plus fin, il laisse la place à la voix.','Écho plus épais.','Un écho fin gêne moins la voix principale.'],
 'dly.hc':['High cut',"Enlève les aigus de l'écho.",'Écho plus brillant.','Écho plus sombre et doux, façon vieux delay.',''],
 'rev.size':['Size','La taille de la pièce.','Pièce plus grande.','Pièce plus petite.',''],
 'rev.decay':['Decay',"Combien de temps la réverb met à s'éteindre.",'La queue dure plus longtemps.',"La queue s'arrête vite.",'Long pour les ballades, court pour le rap.'],
 'rev.pre':['Pre-delay','Le petit silence avant que la réverb commence.','La voix reste plus nette devant la réverb.','La réverb colle directement à la voix.','20 à 50 ms gardent la voix claire.'],
 'rev.damp':['Damping','Si la réverb est brillante ou étouffée.','Réverb plus sombre et douce.','Réverb plus brillante.',''],
 'rev.mix':['Mix','Le volume de la réverb.','Plus de réverb, plus loin.','Moins de réverb, plus proche.',"Monte jusqu'à l'entendre, puis redescends un peu."]};

const base=()=>({on:{gate:1,eq:1,ds:1,comp:1,sat:1,dbl:0,dly:1,rev:1},
 eq:[{t:'hp',f:90,g:0,q:.7},{t:'ls',f:220,g:-2,q:.7},{t:'pk',f:450,g:-3,q:1.4},{t:'pk',f:3200,g:2.5,q:1},{t:'hs',f:10000,g:4,q:.7}],
 gate:{thr:-50,att:1,rel:80,range:30},ds:{f:6500,thr:-28,range:6,mode:'SPLIT',listen:0},
 comp:{type:'CLEAN',thr:-20,ratio:4,att:5,rel:60,knee:6,mk:5},sat:{type:'TAPE',drive:20,tone:50,mix:50},
 dbl:{width:60,det:12,dl:18,mix:40},dly:{time:'1/8',fb:20,mix:15,lc:200,hc:6000,pp:0},rev:{type:'PLATE',size:40,decay:.9,pre:20,damp:50,mix:14},out:0});
// Genre → presets: each one lists only what it changes from the starting point.
const G={
 'HIP-HOP':{'CLEAN PUNCH':{},'TRAP WIDE AIR':{on:{dbl:1},eq:{3:{g:3.5},4:{g:6}},comp:{ratio:6,thr:-22,type:'FET'},rev:{mix:22,decay:1.4},dly:{time:'1/4',mix:24}},'DRILL GRIT':{comp:{ratio:8,att:2,thr:-24,type:'FET'},sat:{drive:55,type:'TUBE'},eq:{2:{f:600,g:-4},3:{f:2500,g:4}},rev:{mix:10,decay:.7,type:'ROOM'}},'BOOM BAP DUSTY':{sat:{type:'TAPE',drive:45,tone:35},eq:{4:{t:'lp',f:9000,g:0}},rev:{type:'ROOM',mix:12},comp:{type:'OPTO',ratio:4}}},
 'R&B / SOUL':{'R&B SILKY':{on:{dbl:1},comp:{ratio:3,att:12,rel:120,thr:-18,type:'OPTO'},eq:{4:{g:5.5}},rev:{mix:28,decay:2.2,size:70,type:'HALL'},dly:{time:'1/4',mix:20}},'SOUL WARM':{comp:{type:'OPTO',ratio:3},sat:{type:'TUBE',drive:35},eq:{1:{g:1.5},4:{g:2}},rev:{type:'PLATE',mix:20,decay:1.5}},'GOSPEL BIG ROOM':{on:{dbl:1},dbl:{width:85},rev:{type:'HALL',size:85,decay:3,mix:30},comp:{ratio:3}}},
 'JAZZ':{'VELVET CLUB':{comp:{type:'OPTO',ratio:2.5,att:20,rel:200,thr:-16},sat:{type:'TUBE',drive:25},eq:{3:{f:2500,g:1.5},4:{g:2}},rev:{type:'ROOM',size:35,decay:1.1,mix:18},on:{dly:0}},'VINTAGE RIBBON':{eq:{0:{f:70},4:{t:'lp',f:11000,g:0},1:{g:2.5}},comp:{type:'VARI-MU',ratio:2},sat:{type:'TUBE',drive:30},rev:{type:'CHAMBER',mix:20,decay:1.6},on:{dly:0}},'LATE NIGHT':{comp:{type:'OPTO',ratio:3},eq:{4:{g:1}},rev:{type:'PLATE',decay:2.4,mix:24,pre:40},dly:{time:'1/4',mix:10}}},
 'BLUES':{'SMOKY BAR':{sat:{type:'TUBE',drive:45,tone:40},comp:{type:'FET',ratio:5},eq:{2:{f:800,g:2},4:{g:-1}},rev:{type:'ROOM',mix:16},dly:{time:'1/8',mix:12}},'ROADHOUSE':{sat:{type:'CONSOLE',drive:50},eq:{0:{f:150},3:{f:1800,g:4}},rev:{type:'SPRING',mix:22},dly:{time:'1/8D',fb:25,mix:18}},'DELTA RADIO':{eq:{0:{f:400},4:{t:'lp',f:4000,g:0}},sat:{type:'FUZZ',drive:40},rev:{type:'SPRING',mix:18},on:{dly:0}}},
 'ROCK / METAL':{'ARENA ROCK':{comp:{type:'FET',ratio:6},sat:{drive:40,type:'TUBE'},on:{dbl:1},rev:{type:'HALL',mix:20},dly:{time:'1/4',mix:16}},'METAL SCREAM':{comp:{type:'FET',ratio:12,att:1,thr:-28},sat:{type:'FUZZ',drive:60,mix:40},eq:{2:{f:500,g:-5},3:{f:3000,g:3}},rev:{mix:10,type:'ROOM'}},'INDIE GARAGE':{sat:{type:'TAPE',drive:55},eq:{4:{t:'lp',f:8000,g:0}},rev:{type:'SPRING',mix:20}}},
 'POP / DANCE':{'RADIO POP':{eq:{3:{f:3500,g:3},4:{g:6.5}},comp:{ratio:4,thr:-24,mk:7},dbl:{width:45},on:{dbl:1},rev:{mix:18,decay:1.6}},'INTIMATE':{comp:{type:'OPTO',ratio:3},rev:{mix:10,decay:.8,type:'ROOM'},eq:{1:{g:2}},on:{dly:0}},'CLUB DANCE':{on:{dbl:1},dly:{time:'1/8D',pp:1,mix:24},rev:{type:'HALL',mix:24}}},
 'WORLD':{'AFRO BRIGHT':{eq:{4:{f:9000,g:5}},dly:{time:'1/8D',mix:26,fb:30,pp:1},rev:{mix:20,decay:1.2}},'REGGAE ROOTS':{dly:{time:'1/4',fb:55,mix:30,hc:3000},rev:{type:'SPRING',mix:22},sat:{type:'TAPE',drive:35}},'REGGAETON':{on:{dbl:1},comp:{type:'FET',ratio:6},dly:{time:'1/8',pp:1,mix:18},eq:{4:{g:5}}},'COUNTRY NASHVILLE':{comp:{type:'OPTO',ratio:3},eq:{3:{f:2800,g:2.5},4:{g:3}},rev:{type:'PLATE',mix:20},dly:{time:'1/4',mix:14}}},
 'OTHER':{'LO-FI TAPE':{eq:{0:{f:250},4:{t:'lp',f:6000,g:0}},sat:{drive:70,mix:80},comp:{ratio:3},rev:{mix:24,decay:1.3}},'TELEPHONE':{eq:{0:{f:500},4:{t:'lp',f:3000,g:0},3:{f:1500,g:6}},sat:{type:'FUZZ',drive:35},on:{rev:0,dly:0}},'PODCAST':{comp:{type:'OPTO',ratio:3,thr:-22},on:{rev:0,dly:0,sat:0},gate:{thr:-45},eq:{1:{g:-1},4:{g:2}}},'BACKING VOCALS':{on:{dbl:1},dbl:{width:95},eq:{0:{f:200},1:{g:-4}},rev:{mix:30,decay:2}}}};
const MINE='MY PRESETS';
let userPresets={};
function build(def){const s=base();for(const k in def){if(k==='eq'){for(const i in def.eq)Object.assign(s.eq[i],def.eq[i])}else if(k==='out')s.out=def.out;else Object.assign(s[k],def[k])}return s}

// Each parameter of the plug-in: where it lives in S, and whether it is a number, an on/off or a list.
const PARAMS={};
['gate','eq','ds','comp','sat','dbl','dly','rev'].forEach(m=>PARAMS['on_'+m]=[['on',m],'b']);

const LESS=/(moins|less|pas trop|baisse|enleve|retire|reduis|reduce|remove|trop)\s+(de\s+|d\s+|du\s+|la\s+|le\s+|les\s+|of\s+|the\s+)*$/;
function readWishes(text){const t=' '+norm(text)+' ',found=[];
 // "Beaucoup" or "un peu" counts only for the wish it stands just before.
 const strength=b=>/(beaucoup|vraiment|tres|encore plus|un max|a fond|a lot|much|really|very)/.test(b)?1.6:/(un peu|legerement|leger|slightly|a bit|a little|un chouia)/.test(b)?.5:1;
 WISHES.forEach(w=>{let at=-1,hit='';w.keys.forEach(k=>{const i=t.indexOf(k);if(i>=0&&(at<0||i<at)){at=i;hit=k}});if(at<0)return;
  const before=t.slice(Math.max(0,at-28),at),less=LESS.test(before);
  // "Moins de sss" already means what the wish does; "moins de clarté" turns the wish round.
  found.push({w,sign:w.inv?1:less?-1:1,amount:strength(t.slice(Math.max(0,at-24),at))})});
 return found}
function applyWishes(found){const before=JSON.parse(JSON.stringify(S)),lines=[];
 found.forEach(({w,sign,amount})=>{w.do(amount*sign).forEach(([r,v,mode])=>{const id=idOf(r.o,r.k);let nv;
   if(mode==='set'){if(sign<0&&typeof v==='number'&&r.k!=='f'&&r.k!=='q'&&r.o!==S.on)return;nv=v}else nv=clamp(r.o[r.k]+v,r.lo,r.hi);
   if(r.k!=='t')nv=typeof nv==='number'?Math.round(nv*10)/10:nv;r.o[r.k]=nv;if(id)sendParam(id)});
  lines.push((sign<0?w.say.replace(/^plus /,'moins ').replace(/^moins de « sss »$/,'moins de « sss »'):w.say))});
 touch();return{before,lines}}
